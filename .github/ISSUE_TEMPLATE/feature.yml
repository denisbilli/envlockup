name: Feature request
description: Something envlockup should do
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The situation and the goal, before any solution. Who is on the team, where the file is used (laptops, CI, servers).
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today?
      description: How you work around it now, with envlockup or another tool.
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
