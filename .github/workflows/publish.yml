name: Publish

on:
  release:
    types: [published]

# Published with npm trusted publishing: the registry accepts this workflow's
# OIDC token, so there is no npm token stored anywhere.
permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    # Tags starting with py-v are Python releases (publish-python.yml).
    if: ${{ !startsWith(github.event.release.tag_name, 'py-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use a cache in release builds
      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$TAG" = "v$version" || { echo "release tag $TAG does not match package.json version $version"; exit 1; }
      # npm's OIDC exchange with the registry needs npm 11.5.1 or later; the npm
      # that ships with Node 22 is older.
      - run: npm install -g npm@latest
      - run: sudo apt-get install -y age
      - run: npm ci
      - run: npm publish --provenance --access public
