[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "envseal-python"
version = "0.1.0"
description = "Read envseal files from Python: encrypted .env files you can commit, decrypted with your SSH or age key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "denisbilli" }]
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41",
  "bcrypt>=4", # passphrase-protected OpenSSH keys
]
keywords = ["dotenv", "env", "secrets", "encryption", "ssh", "age"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/denisbilli/envseal"

[tool.hatch.build.targets.wheel]
packages = ["src/envseal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
